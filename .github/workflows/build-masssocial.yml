---
name: "Build MASSSOCIAL image"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=masssocial-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/masssocial:latest
            ghcr.io/${{ github.repository_owner }}/masssocial:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
